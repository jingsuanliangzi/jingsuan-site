name: Auto Sitemap and IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitemap-and-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate complete sitemap
        run: python scripts/generate_sitemap.py

      - name: Commit sitemap when it changed
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: auto-update sitemap [skip ci]"
            git push
          fi

      # GitHub Pages branch deployments normally take a short time.
      # Waiting helps make sure the IndexNow key and changed pages are live first.
      - name: Wait for GitHub Pages deployment
        run: sleep 75

      - name: Notify IndexNow about changed pages
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python scripts/submit_indexnow.py
